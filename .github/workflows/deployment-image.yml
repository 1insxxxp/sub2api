name: Build deployment image

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release identity
        id: release
        run: |
          set -euo pipefail
          version=$(cat backend/cmd/server/VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          short_commit=${SOURCE_COMMIT:0:9}
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=sub2api-custom:$version-$short_commit" >> "$GITHUB_ENV"
          echo "ARCHIVE=sub2api-$version-$short_commit.tar.gz" >> "$GITHUB_ENV"
          echo "artifact=sub2api-$version-$short_commit-linux-amd64" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Verify source and build image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(cat backend/cmd/server/VERSION)" = "$APP_VERSION"
          docker buildx build --platform linux/amd64 --load --no-cache \
            --build-arg VERSION="$APP_VERSION" \
            --build-arg COMMIT="$SOURCE_COMMIT" \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GOSUMDB=sum.golang.org \
            --tag "$IMAGE" --file Dockerfile .
      - name: Verify binary and export image
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          docker run --rm --entrypoint /app/sub2api "$IMAGE" -version 2>&1 | tee image-artifact/version.txt
          grep -F "$APP_VERSION" image-artifact/version.txt
          grep -F "$SOURCE_COMMIT" image-artifact/version.txt
          docker image inspect "$IMAGE" --format '{{.Id}}' > image-artifact/image-id.txt
          docker save "$IMAGE" | gzip -1 > "image-artifact/$ARCHIVE"
          cd image-artifact
          sha256sum "$ARCHIVE" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: image-artifact/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

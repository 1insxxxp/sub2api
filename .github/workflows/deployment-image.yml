name: Build deployment image

on:
  push:
    branches:
      - codex/build-0.2.6-0597f9c1b

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_COMMIT: 0597f9c1b62939d579215e0d8ff5c42b704095ae
      APP_VERSION: 0.2.6
      IMAGE: sub2api-custom:0.2.6-0597f9c1b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0597f9c1b62939d579215e0d8ff5c42b704095ae
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Verify source and build image
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(cat backend/cmd/server/VERSION)" = "$APP_VERSION"
          docker buildx build --platform linux/amd64 --load --no-cache \
            --build-arg VERSION="$APP_VERSION" \
            --build-arg COMMIT="$SOURCE_COMMIT" \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg GOSUMDB=sum.golang.org \
            --tag "$IMAGE" --file Dockerfile .
      - name: Verify binary and export image
        run: |
          set -euo pipefail
          mkdir -p image-artifact
          docker run --rm --entrypoint /app/sub2api "$IMAGE" -version 2>&1 | tee image-artifact/version.txt
          grep -F "$APP_VERSION" image-artifact/version.txt
          grep -F "$SOURCE_COMMIT" image-artifact/version.txt
          docker image inspect "$IMAGE" --format '{{.Id}}' > image-artifact/image-id.txt
          docker save "$IMAGE" | gzip -1 > image-artifact/sub2api-0.2.6-0597f9c1b.tar.gz
          cd image-artifact
          sha256sum sub2api-0.2.6-0597f9c1b.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-0.2.6-0597f9c1b-linux-amd64
          path: image-artifact/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
